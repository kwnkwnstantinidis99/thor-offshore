# =============================================================================
# Thor Offshore Wind Farm — Feasibility Case Study
# Input assumptions (SINGLE SOURCE OF TRUTH — no numbers may be hardcoded in /src)
# =============================================================================
#
# HOW TO READ THIS FILE
# ---------------------
#   [CONFIRMED]   Publicly documented fact or corroborated across sources.
#   [ESTIMATED]   Not published, derived from comparable projects/benchmarks.
#   [PLACEHOLDER] Dummy value present only so the pipeline runs end to end.
#   [UNRESOLVED]  Known open question; value is null, validate() refuses to
#                 run unless --allow-unresolved is passed.
#
# UNITS: money=EUR real 2024 terms unless "nominal"; power=MW; energy=MWh;
#        rates=decimal fractions; years=calendar years or integer offsets.
# =============================================================================

meta:
  case_name: "Thor Offshore Wind Farm (Denmark) — mechanism comparison"
  currency: "EUR"
  money_terms: "real_2024"
  analysis_version: "0.3.0-implementation"
  disclaimer: >
    Independent academic/portfolio analysis built on public information and
    openly stated assumptions. Not RWE's actual financial model, not investment
    advice, and not affiliated with RWE or the Danish Energy Agency.

fx:
  dkk_per_eur: 7.45                # [CONFIRMED] Danish peg, effectively stable

# -----------------------------------------------------------------------------
# 1. Technical configuration
# -----------------------------------------------------------------------------
technical:
  installed_capacity_mw: 1000.0    # [CONFIRMED]
  turbine_count: 72                # [CONFIRMED]
  turbine_model: "SG 14-236 DD"    # [CONFIRMED]
  turbine_rated_mw: 14.0           # [CONFIRMED]

  net_capacity_factor: 0.525       # [CONFIRMED] ~52.5% quoted publicly

  # RESOLVED (was [UNRESOLVED]): treated as NET as a stated analyst working
  # assumption. Original source does not explicitly confirm net vs. gross —
  # this is a documented judgement call, not a verified fact.
  capacity_factor_is_net: true     # [CONFIRMED] analyst assumption, see note above

  availability: 1.00               # neutral — capacity_factor_is_net = true
  wake_and_electrical_loss: 0.00   # neutral — capacity_factor_is_net = true
  annual_degradation_rate: 0.003   # [ESTIMATED] ~0.2-0.5%/yr output decline

# -----------------------------------------------------------------------------
# 2. Timeline
# -----------------------------------------------------------------------------
timeline:
  fid_year: 2023                   # [ESTIMATED]
  construction_years: 4            # [ESTIMATED]
  cod_year: 2027                   # [CONFIRMED]
  operating_life_years: 30         # [CONFIRMED] 30 yr concession
  concession_years: 30             # [CONFIRMED] IEA Wind TCP Denmark 2021
  decommissioning_years: 2         # [ESTIMATED]

# -----------------------------------------------------------------------------
# 3. Capital cost
# -----------------------------------------------------------------------------
capex:
  total_capex_eur: 2_100_000_000   # [CONFIRMED] ~DKK 15.5bn
  source_figure_dkk: 15_500_000_000  # documentation only
  capex_eur_per_kw: null

  contingency_rate: 0.00           # [CONFIRMED] avoids double-counting
  spend_profile: [0.10, 0.30, 0.40, 0.20]   # [ESTIMATED] sums to 1.0

  grid_connection_in_scope: true   # [CONFIRMED] developer bears full cost
  grid_connection_cost_eur: 0      # [CONFIRMED] zero by construction — already in CAPEX

# -----------------------------------------------------------------------------
# 4. Operating cost
# -----------------------------------------------------------------------------
opex:
  fixed_opex_eur_per_mw_year: 50_000   # [CONFIRMED] midpoint of EUR 45-55k benchmark
  opex_benchmark_low_eur_per_mw_year: 45_000    # [CONFIRMED]
  opex_benchmark_high_eur_per_mw_year: 55_000   # [CONFIRMED]

  variable_opex_eur_per_mwh: 0.0   # [CONFIRMED] all-in benchmark, no separate variable leg
  seabed_lease_eur_per_year: 0     # [PLACEHOLDER]
  opex_real_escalation_rate: 0.005 # [ESTIMATED]
  major_overhaul:
    year_offsets: [15]             # [PLACEHOLDER]
    cost_eur: 50_000_000           # [PLACEHOLDER]

# -----------------------------------------------------------------------------
# 5. Decommissioning
# -----------------------------------------------------------------------------
decommissioning:
  cost_eur_per_mw: 368_000         # [CONFIRMED] midpoint of EUR 322-414k/MW
  base_low_eur_per_mw: 322_000     # [CONFIRMED]
  base_high_eur_per_mw: 414_000    # [CONFIRMED]
  sensitivity_low_eur_per_mw: 200_000    # [CONFIRMED]
  sensitivity_high_eur_per_mw: 600_000   # [CONFIRMED]

  scrap_credit_eur_per_mw: 0       # [CONFIRMED] already netted in the benchmark
  fund_annually: false             # [PLACEHOLDER]

# -----------------------------------------------------------------------------
# 6. Market price environment (deterministic base path — documentation only)
# -----------------------------------------------------------------------------
market:
  base_power_price_eur_per_mwh: 60.0   # [PLACEHOLDER] not used when stochastic mode is on
  real_price_escalation_rate: 0.00     # [PLACEHOLDER]
  capture_rate: 0.85                   # [ESTIMATED] wind capture / baseload ratio
  capture_rate_annual_decline: 0.002   # [ESTIMATED] cannibalisation trend
  negative_price_hours_share: 0.02     # [PLACEHOLDER]

# -----------------------------------------------------------------------------
# 7. Stochastic DK1 price model (Ornstein-Uhlenbeck) — src/price_model.py
# -----------------------------------------------------------------------------
price_model:
  process: "ornstein_uhlenbeck"
  formulation: "arithmetic"        # NOT log-OU — must admit negative prices
  horizon: "derive_from_timeline"  # never hardcoded

  calibration:
    source_file: "data/dk1_annual_prices.csv"
    method: "ar1_ols"

    # Health warning: even with 10 usable points (2015-2018 proxy + 2020-2025,
    # 2019 blank), reversion-speed identification from annual data is weak.
    # 2021-2023 are energy-crisis years that bias the long-run mean upward.
    exclude_years: [2021, 2022, 2023]   # [CONFIRMED] analyst decision — drop crisis years from MEAN estimate
    min_observations: 5
    deflate_to_real: true            # [CONFIRMED]
    warn_below_observations: 15

  parameters:
    long_run_mean_eur_per_mwh: null    # fitted from non-excluded years
    reversion_speed_per_year: null     # overridden by half_life_years below
    half_life_years: 5.0               # [ESTIMATED] prior; kappa = ln(2)/half_life
    volatility_eur_per_mwh: null       # fitted (residual std of AR(1) innovations)
    initial_price_eur_per_mwh: null    # defaults to last observation (2025)

    # Forward-looking preference: the point of this model is to project the
    # NEXT 30 years, not to perfectly explain the last 10. A raw statistical
    # fit off ~10 annual points is not more "correct" than a judgement-based
    # half-life prior — it is just overfit to a short, crisis-distorted
    # window. Keep true regardless of how many historical points are added.
    prefer_half_life_over_fit: true    # [CONFIRMED] analyst decision

  negative_prices:
    allow: true                    # [CONFIRMED] required by cap_accounting: net
    floor_eur_per_mwh: -50.0       # [ESTIMATED] technical bid floor

  simulation:
    iterations: 1000
    random_seed: 42
    antithetic_variates: true
    apply_capture_rate: true

# -----------------------------------------------------------------------------
# 8. Financing and tax
# -----------------------------------------------------------------------------
finance:
  discount_rate_real: 0.070        # [PLACEHOLDER] project WACC
  equity_discount_rate: 0.100      # [PLACEHOLDER]
  corporate_tax_rate: 0.22         # [CONFIRMED] Danish corporate tax rate

  depreciation:
    method: "declining_balance"    # [CONFIRMED]
    declining_balance_rate: 0.15   # [CONFIRMED] 15%/yr, turbines > 1MW
    general_machinery_rate: 0.25   # documentation only — NOT applicable
    write_off_threshold_eur: 1_000_000   # [ESTIMATED]
    split_asset_classes: false     # [PLACEHOLDER]
    loss_carryforward: true        # [CONFIRMED]

  debt:
    gearing: 0.60                  # [PLACEHOLDER]
    interest_rate_nominal: 0.055   # [PLACEHOLDER]
    tenor_years: 18                # [PLACEHOLDER]
    amortisation: "annuity"
    target_min_dscr: 1.30          # [PLACEHOLDER]

# -----------------------------------------------------------------------------
# 9. Mechanism-specific contract terms
# -----------------------------------------------------------------------------
contracts:

  fixed_ppa:
    contract_price_eur_per_mwh: 75.0   # [PLACEHOLDER]
    price_indexation_rate: 0.00
    term_years: 20                     # [PLACEHOLDER] realistic PPA tenor, not 30
    contracted_volume_share: 1.00
    post_term_treatment: "merchant"
    offtaker_credit_spread: 0.000

  two_sided_cfd:
    # CRITICAL FIX (was 30.0 placeholder — wrong): confirmed real Thor strike
    # price is DKK 0.1/MWh (~EUR 0.01/MWh). Strike is effectively zero, so
    # almost all revenue is merchant revenue from day one; the CfD only pays
    # out when the captured market price dips below ~zero.
    strike_price_eur_per_mwh: 0.01     # [CONFIRMED] DKK 0.1/MWh converted
    strike_indexation_rate: 0.00
    term_years: 30                      # [CONFIRMED] full 30yr concession

    # RELABELED (was [PLACEHOLDER], value was already correct)
    cumulative_payment_cap_eur: 375_000_000   # [CONFIRMED] Copenhagen Economics, DKK 2.8bn

    cap_accounting: "net"                     # [CONFIRMED] analyst decision
    on_cap_reached: "terminate_to_merchant"   # [CONFIRMED] analyst decision
    clawback_survives_cap: false              # [CONFIRMED] Copenhagen Economics
    settle_partial_year: true                 # [CONFIRMED] analyst decision
    settlement_volume_basis: "metered"        # [ESTIMATED]

  multi_criteria:
    weights:
      price: 0.30                      # [CONFIRMED]
      environmental: 0.30              # [CONFIRMED]
      hybrid: 0.20                     # [CONFIRMED]
      social: 0.20                     # [CONFIRMED]
    scores:
      price: 90.0                      # [PLACEHOLDER]
      environmental: 70.0              # [PLACEHOLDER]
      hybrid: 50.0                     # [PLACEHOLDER]
      social: 60.0                     # [PLACEHOLDER]
    outcome_mapping: "price_adjustment"
    price_adjustment:
      reference_price_eur_per_mwh: 75.0   # [PLACEHOLDER]
      max_uplift_eur_per_mwh: 10.0        # [PLACEHOLDER]
      max_discount_eur_per_mwh: 10.0      # [PLACEHOLDER]
    revenue_sharing:
      producer_share_at_max_score: 1.00   # [PLACEHOLDER]
      producer_share_at_min_score: 0.80   # [PLACEHOLDER]
    compliance_cost:
      capex_uplift_eur: 0                 # [PLACEHOLDER]
      opex_uplift_eur_per_year: 0         # [PLACEHOLDER]
    term_years: 30                        # [ESTIMATED]

# -----------------------------------------------------------------------------
# 10. Sensitivity analysis ranges
# -----------------------------------------------------------------------------
sensitivity:
  metric: "npv_eur"
  ranges:
    - name: "CAPEX"
      path: "capex.total_capex_eur"
      mode: "relative"
      low: 0.90
      high: 1.15
    - name: "Fixed OPEX"
      path: "opex.fixed_opex_eur_per_mw_year"
      mode: "absolute"
      low: 45_000
      high: 55_000
    - name: "Decommissioning"
      path: "decommissioning.cost_eur_per_mw"
      mode: "absolute"
      low: 200_000
      high: 600_000
    - name: "Market price"
      path: "market.base_power_price_eur_per_mwh"
      mode: "relative"
      low: 0.60
      high: 1.40
    - name: "Discount rate"
      path: "finance.discount_rate_real"
      mode: "absolute"
      low: 0.055
      high: 0.090
    - name: "Capacity factor"
      path: "technical.net_capacity_factor"
      mode: "absolute"
      low: 0.480
      high: 0.550
    - name: "Capture rate"
      path: "market.capture_rate"
      mode: "absolute"
      low: 0.75
      high: 0.92
    - name: "CfD cap"
      path: "contracts.two_sided_cfd.cumulative_payment_cap_eur"
      mode: "relative"
      low: 0.50
      high: 2.00

  monte_carlo_assumptions:
    enabled: false
    iterations: 1000
    random_seed: 42
    distributions:
      - path: "capex.total_capex_eur"
        distribution: "triangular"
        low: 0.90
        mode: 1.00
        high: 1.15
        mode_is_relative: true

# -----------------------------------------------------------------------------
# 11. Output configuration
# -----------------------------------------------------------------------------
outputs:
  directory: "outputs"
  chart_format: "png"
  chart_dpi: 150
  save_cashflow_csv: true
  plotting_backend: "matplotlib"

# -----------------------------------------------------------------------------
# 12. Sources
# -----------------------------------------------------------------------------
sources:
  - label: "IEA Wind TCP — Denmark 2021 annual report"
    used_for: ["concession duration (30 years)"]
  - label: "Copenhagen Economics — analysis of Thor CfD ('Gone with the Wind')"
    used_for: ["clawback_survives_cap = false", "full termination on cap exhaustion", "payment cap"]
  - label: "RWE — Thor project page / press releases"
    used_for: ["capacity", "turbine count", "COD", "grid connection scope"]
  - label: "Siemens Gamesa — SG 14-236 DD datasheet"
    used_for: ["turbine rating"]
  - label: "European offshore wind cost benchmark 2023-2024 (peer-reviewed)"
    used_for: ["OPEX EUR 45-55k/MW/yr", "decommissioning EUR 322-414k/MW"]
  - label: "Danish tax law — depreciation of wind turbines > 1 MW"
    used_for: ["15%/yr declining balance from 1 Jan 2013", "22% corporate tax"]
  - label: "ACER (ENTSO-E TP data) — Nord/Balt annual day-ahead prices"
    used_for: ["2015-2018 price proxy in data/dk1_annual_prices.csv"]
  - label: "Nord Pool / Energinet — DK1 historical spot prices 2020-2025"
    used_for: ["OU calibration (data/dk1_annual_prices.csv)"]
